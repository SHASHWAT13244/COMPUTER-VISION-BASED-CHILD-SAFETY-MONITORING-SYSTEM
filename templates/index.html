<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Safety Monitoring System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .probability-bar {
            margin: 4px 0;
        }
        .probability-bar .label {
            width: 80px;
            font-size: 12px;
            font-weight: 500;
        }
        .probability-bar .progress {
            height: 22px;
            border-radius: 4px;
        }
        .probability-bar .progress-bar {
            font-size: 11px;
            line-height: 22px;
            font-weight: 600;
            transition: width 0.6s ease;
        }
        .upload-result-container {
            max-height: 500px;
            overflow-y: auto;
        }
        .upload-result-container img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .status-badge.active {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }
        .status-badge.inactive {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid #dc3545;
        }
        .status-badge .fa-circle {
            font-size: 10px;
            margin-right: 6px;
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .video-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
        }
        .alert-item {
            padding: 8px 12px;
            border-left: 3px solid #ffc107;
            margin-bottom: 5px;
            background: #fff8e1;
            border-radius: 4px;
            font-size: 13px;
        }
        .alert-item.high {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        .alert-item.medium {
            border-left-color: #ffc107;
            background: #fff3cd;
        }
        .alert-item.low {
            border-left-color: #17a2b8;
            background: #d1ecf1;
        }
        .alert-item .timestamp {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .status-item label {
            font-weight: 600;
            color: #666;
        }
        .status-item .value {
            font-weight: 600;
            color: #333;
        }
        .status-item .value.safe {
            color: #28a745;
        }
        .status-item .value.danger {
            color: #dc3545;
        }
        .confidence-high {
            color: #28a745;
        }
        .confidence-medium {
            color: #ffc107;
        }
        .confidence-low {
            color: #dc3545;
        }
        #alertContainer {
            max-height: 200px;
            overflow-y: auto;
        }
        #alertContainer::-webkit-scrollbar {
            width: 4px;
        }
        #alertContainer::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        #uploadResult .alert {
            margin-bottom: 10px;
        }
        #uploadResult .progress {
            height: 22px;
        }
        #uploadResult .progress-bar {
            font-size: 12px;
            line-height: 22px;
        }
        
        /* Source indicator styles */
        #sourceIndicator {
            display: none;
        }
        #analysisTimeIndicator {
            display: none;
        }
        #analysisTimeIndicator .value {
            font-size: 12px;
            color: #6c757d;
        }
        .source-badge-live {
            background: #17a2b8;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 5px;
        }
        .source-badge-image {
            background: #9C27B0;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 5px;
        }
        .bg-purple {
            background-color: #9C27B0;
            color: white;
        }
        
        /* Flash animation */
        @keyframes flash-warning {
            0% { background-color: #fff3cd; }
            50% { background-color: #ffc107; }
            100% { background-color: #fff3cd; }
        }
        .flash-warning {
            animation: flash-warning 1.5s ease 3;
        }
        
        @keyframes pulse-danger {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-badge.unsafe {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid #dc3545;
            animation: pulse-danger 1s ease infinite;
        }
        .status-badge.image-analysis {
            background: rgba(156, 39, 176, 0.2);
            color: #9C27B0;
            border: 1px solid #9C27B0;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-shield-alt"></i> Child Safety Monitor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('index') }}">
                            <i class="fas fa-home"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">
                            <i class="fas fa-chart-line"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('alerts_page') }}">
                            <i class="fas fa-bell"></i> Alerts
                            <span class="badge bg-danger" id="alertBadge" style="display: none;">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('about') }}">
                            <i class="fas fa-info-circle"></i> About
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Left Column: Video Feed -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-video"></i> Live Feed</h5>
                        <span class="status-badge inactive" id="statusBadge">
                            <i class="fas fa-circle"></i> Inactive
                        </span>
                    </div>
                    <div class="card-body p-0">
                        <div class="video-container">
                            <img id="videoFeed" src="{{ url_for('video_feed') }}" 
                                 alt="Video Feed" class="img-fluid">
                            <div class="video-overlay" id="overlayStatus">
                                <span class="status-badge inactive" id="overlayBadge">
                                    <i class="fas fa-circle"></i> Inactive
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="row g-2 align-items-center">
                            <div class="col-md-7">
                                <div class="btn-group w-100" role="group">
                                    <button class="btn btn-success" id="startBtn">
                                        <i class="fas fa-play"></i> Start
                                    </button>
                                    <button class="btn btn-danger" id="stopBtn" disabled>
                                        <i class="fas fa-stop"></i> Stop
                                    </button>
                                    <button class="btn btn-warning" id="resetBtn">
                                        <i class="fas fa-redo"></i> Reset
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-5 text-end">
                                <button class="btn btn-info" id="captureBtn">
                                    <i class="fas fa-camera"></i> Capture
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Status & Upload -->
            <div class="col-lg-4">
                <!-- Status Card -->
                <div class="card">
                    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-info-circle"></i> Status</h5>
                        <span class="badge bg-light text-dark" id="statusSource">Live</span>
                    </div>
                    <div class="card-body">
                        <div class="status-item">
                            <label>Activity:</label>
                            <span id="currentActivity" class="value">None</span>
                        </div>
                        <div class="status-item">
                            <label>Confidence:</label>
                            <span id="currentConfidence" class="value confidence-low">0%</span>
                        </div>
                        <div class="status-item">
                            <label>Safety Status:</label>
                            <span id="safetyStatus" class="value safe">✅ Safe</span>
                        </div>
                        <div class="status-item">
                            <label>Alert Count:</label>
                            <span id="alertCount" class="value">0</span>
                        </div>
                        <div class="status-item">
                            <label>FPS:</label>
                            <span id="fpsDisplay" class="value">0</span>
                        </div>
                        <!-- Source indicator -->
                        <div class="status-item" id="sourceIndicator" style="display: none;">
                            <label>Source:</label>
                            <span id="dataSource" class="value text-info">Live Feed</span>
                        </div>
                        <!-- Analysis Time -->
                        <div class="status-item" id="analysisTimeIndicator" style="display: none;">
                            <label>Analyzed At:</label>
                            <span id="analysisTime" class="value text-muted" style="font-size: 12px;">-</span>
                        </div>
                    </div>
                </div>

                <!-- Upload Image Card -->
                <div class="card mt-3">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0"><i class="fas fa-upload"></i> Upload Image</h5>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <input type="file" class="form-control" id="imageInput" 
                                       accept="image/*" required>
                                <div class="form-text" id="fileInfo">Select an image to analyze</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="uploadBtn">
                                <i class="fas fa-upload"></i> Analyze Image
                            </button>
                        </form>
                        <div id="uploadResult" class="mt-3 upload-result-container"></div>
                    </div>
                </div>

                <!-- Recent Alerts -->
                <div class="card mt-3">
                    <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-bell"></i> Recent Alerts</h5>
                        <span class="badge bg-light text-dark" id="alertCountBadge">0</span>
                    </div>
                    <div class="card-body" id="alertContainer">
                        <div class="text-muted text-center py-3">No alerts yet</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner Template -->
    <div id="loadingTemplate" style="display: none;">
        <div class="text-center py-3">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Processing image...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
