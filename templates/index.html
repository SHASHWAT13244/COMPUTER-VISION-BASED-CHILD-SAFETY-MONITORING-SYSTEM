<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Safety Monitoring System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-shield-alt"></i> Child Safety Monitor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('index') }}">
                            <i class="fas fa-home"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">
                            <i class="fas fa-chart-line"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('alerts_page') }}">
                            <i class="fas fa-bell"></i> Alerts
                            <span class="badge bg-danger" id="alertBadge">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('about') }}">
                            <i class="fas fa-info-circle"></i> About
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-video"></i> Live Feed</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="video-container">
                            <img id="videoFeed" src="{{ url_for('video_feed') }}" 
                                 alt="Video Feed" class="img-fluid">
                            <div class="video-overlay" id="overlayStatus">
                                <span class="status-badge" id="statusBadge">
                                    <i class="fas fa-circle"></i> Inactive
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <button class="btn btn-success" id="startBtn">
                                    <i class="fas fa-play"></i> Start
                                </button>
                                <button class="btn btn-danger" id="stopBtn">
                                    <i class="fas fa-stop"></i> Stop
                                </button>
                                <button class="btn btn-warning" id="resetBtn">
                                    <i class="fas fa-redo"></i> Reset
                                </button>
                            </div>
                            <div class="col-md-6 text-end">
                                <button class="btn btn-info" id="captureBtn">
                                    <i class="fas fa-camera"></i> Capture
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-info-circle"></i> Status</h5>
                    </div>
                    <div class="card-body">
                        <div class="status-item">
                            <label>Activity:</label>
                            <span id="currentActivity" class="value">None</span>
                        </div>
                        <div class="status-item">
                            <label>Confidence:</label>
                            <span id="currentConfidence" class="value">0%</span>
                        </div>
                        <div class="status-item">
                            <label>Safety Status:</label>
                            <span id="safetyStatus" class="value safe">✅ Safe</span>
                        </div>
                        <div class="status-item">
                            <label>Alert Count:</label>
                            <span id="alertCount" class="value">0</span>
                        </div>
                        <div class="status-item">
                            <label>FPS:</label>
                            <span id="fpsDisplay" class="value">0</span>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0"><i class="fas fa-upload"></i> Upload Image</h5>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <input type="file" class="form-control" id="imageInput" 
                                       accept="image/*" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-upload"></i> Analyze Image
                            </button>
                        </form>
                        <div id="uploadResult" class="mt-3"></div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="fas fa-bell"></i> Recent Alerts</h5>
                    </div>
                    <div class="card-body" id="alertContainer" style="max-height: 200px; overflow-y: auto;">
                        <div class="text-muted text-center">No alerts yet</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
